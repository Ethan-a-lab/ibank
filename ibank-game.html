<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投行梗学闯关 · iBank</title>
<meta name="description" content="iBank 投资银行学课程配套闯关游戏：8 关全解锁，每关 4 题，顺序随机，本地成就系统，离线可玩。">
<style>
  :root{
    --bg:#f6f7fb; --panel:rgba(255,255,255,.9); --panel-solid:#fff;
    --panel-border:rgba(15,23,42,.10);
    --text:#1a2233; --muted:#5b6478; --dim:#646b80;
    --accent:#6366f1; --accent-text:#4f46e5; --accent-solid:#4f46e5;
    --accent2:#0e7490; --accent3:#8b5cf6;
    --good:#0f766e; --bad:#b91c1c; --warn:#b45309;
    --gold:#b45309; --gold-bg:rgba(245,158,11,.14);
    --radius:14px;
    --shadow-sm:0 2px 10px rgba(15,23,42,.05);
    --shadow-md:0 14px 40px rgba(15,23,42,.09);
    --track:rgba(15,23,42,.07);
    --ok-bg:rgba(15,118,110,.10); --err-bg:rgba(185,28,28,.08);
  }
  body.dark{
    --bg:#0d1020; --panel:rgba(24,28,50,.88); --panel-solid:#181c32;
    --panel-border:rgba(148,163,184,.16);
    --text:#e7eaf3; --muted:#9aa4bb; --dim:#8b93ab;
    --accent:#818cf8; --accent-text:#a5b4fc; --accent-solid:#4f46e5;
    --accent2:#22d3ee; --accent3:#c084fc;
    --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
    --gold:#fbbf24; --gold-bg:rgba(251,191,36,.14);
    --shadow-sm:0 2px 10px rgba(0,0,0,.3);
    --shadow-md:0 14px 40px rgba(0,0,0,.45);
    --track:rgba(148,163,184,.14);
    --ok-bg:rgba(52,211,153,.12); --err-bg:rgba(251,113,133,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:var(--accent2);text-decoration:none}

  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.42;z-index:0;pointer-events:none}
  .blob-1{width:440px;height:440px;background:#c7d2fe;top:-150px;left:-120px}
  .blob-2{width:400px;height:400px;background:#a5f3fc;bottom:-150px;right:-100px}
  body.dark .blob{opacity:.16}

  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 18px 60px}

  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
    padding:10px 0;margin-bottom:20px;
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    border-bottom:1px solid var(--panel-border);
    backdrop-filter:blur(14px);
  }
  .back{
    display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    color:var(--muted);padding:7px 12px;border-radius:999px;border:1px solid var(--panel-border);
    background:var(--panel);transition:.2s;white-space:nowrap;
  }
  .back:hover{color:var(--accent-text);border-color:var(--accent);transform:translateX(-2px)}
  .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.2px;margin-right:auto;white-space:nowrap}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
  .stat-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
    padding:5px 11px;border-radius:999px;background:var(--gold-bg);color:var(--gold);
    white-space:nowrap;
  }
  .stat-chip.rank{background:rgba(99,102,241,.12);color:var(--accent-text)}
  .icon-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--panel-border);
    background:var(--panel);display:flex;align-items:center;justify-content:center;
    font-size:15px;transition:.2s;flex:none;
  }
  .icon-btn:hover{border-color:var(--accent);transform:translateY(-1px)}

  /* ===== 视图 ===== */
  .view{display:none;animation:fade .32s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow-sm);backdrop-filter:blur(14px);
  }

  /* ===== 段位卡 ===== */
  .hero{
    position:relative;overflow:hidden;border-radius:18px;padding:22px 24px;margin-bottom:18px;
    background:linear-gradient(135deg,rgba(79,70,229,.10),rgba(124,58,237,.06));
    border:1px solid var(--panel-border);
  }
  .hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .rank-badge{
    width:56px;height:56px;border-radius:16px;flex:none;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 8px 22px rgba(99,102,241,.32);
  }
  .hero-tt{flex:1;min-width:150px}
  .hero-tt h1{font-size:19px;font-weight:800;letter-spacing:.2px}
  .hero-tt p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .progress{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:12px}
  .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f46e5,#8b5cf6);transition:width .5s cubic-bezier(.3,1,.4,1)}
  .hero-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}

  /* ===== 区块标题 ===== */
  .sec{display:flex;align-items:center;gap:9px;margin:24px 0 12px}
  .sec .bar{width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,#4f46e5,#8b5cf6)}
  .sec h2{font-size:15.5px;font-weight:700}
  .sec .more{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
  .sec .more:hover{color:var(--accent-text)}

  /* ===== 关卡网格 ===== */
  .levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .lv{
    position:relative;text-align:left;padding:15px 16px;border-radius:14px;
    background:var(--panel);border:1px solid var(--panel-border);
    transition:.2s;display:flex;gap:13px;align-items:flex-start;overflow:hidden;
  }
  .lv:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-md)}
  .lv.locked{opacity:.5;cursor:not-allowed;filter:saturate(.3)}
  .lv.locked:hover{transform:none;border-color:var(--panel-border);box-shadow:none}
  .lv-no{
    width:38px;height:38px;border-radius:11px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);
    box-shadow:0 4px 12px rgba(99,102,241,.26);line-height:1;
  }
  .lv-no i{font-style:normal;font-size:9px;font-weight:700;opacity:.85;margin-top:2px}
  .lv.done .lv-no{background:linear-gradient(135deg,#0f766e,#059669)}
  .lv.locked .lv-no{background:var(--dim);box-shadow:none}
  .lv-body{flex:1;min-width:0}
  .lv-body h3{font-size:14px;font-weight:700;line-height:1.4}
  .lv-body p{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lv-stars{display:flex;gap:2px;margin-top:6px;font-size:11px;letter-spacing:1px}
  .lv-stars .s{color:var(--dim);opacity:.35}
  .lv-stars .s.on{color:#f59e0b;opacity:1}
  .lv-lock{position:absolute;right:12px;top:12px;font-size:12px;color:var(--dim)}

  /* ===== 每日挑战 ===== */
  .daily{
    display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;
    background:linear-gradient(120deg,rgba(14,116,144,.10),rgba(99,102,241,.07));
    border:1px solid var(--panel-border);transition:.2s;width:100%;text-align:left;
  }
  .daily:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .daily .d-ico{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--panel-solid);border:1px solid var(--panel-border)}
  .daily .d-body{flex:1;min-width:0}
  .daily h3{font-size:14px;font-weight:700}
  .daily p{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-solid);color:#fff;flex:none}
  .pill.ok{background:var(--good)}
  .pill.retry{background:#f59e0b}

  /* ===== 答题 ===== */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .qhead .lvname{font-size:12.5px;font-weight:700;color:var(--accent-text)}
  .qhead .qn{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .qhead .quit{font-size:11.5px;font-weight:700;color:var(--muted);padding:3px 10px;border-radius:99px;border:1px solid var(--panel-border);transition:.2s}
  .qhead .quit:hover{color:var(--bad);border-color:var(--bad)}
  .qbar{height:5px;border-radius:99px;background:var(--track);overflow:hidden;margin-bottom:20px}
  .qbar i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#8b5cf6);transition:width .35s}

  .meme{
    font-size:13px;color:var(--muted);line-height:1.75;padding:11px 14px;margin-bottom:14px;
    border-left:3px solid var(--accent3);border-radius:0 10px 10px 0;
    background:rgba(139,92,246,.06);
  }
  .meme b{color:var(--accent3);font-weight:700}
  .stem{font-size:16px;font-weight:600;line-height:1.75;margin-bottom:18px;letter-spacing:.1px}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:12px;text-align:left;
    background:var(--panel-solid);border:1.5px solid var(--panel-border);transition:.16s;font-size:14px;line-height:1.65;
  }
  .opt:hover:not(.dis){border-color:var(--accent);background:rgba(99,102,241,.05)}
  .opt .k{
    width:23px;height:23px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:800;background:var(--track);color:var(--muted);margin-top:1px;transition:.16s;
  }
  .opt.sel{border-color:var(--accent);background:rgba(99,102,241,.08)}
  .opt.right{border-color:var(--good);background:var(--ok-bg)}
  .opt.right .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--err-bg)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt.dis{cursor:default}
  .opt .tag{margin-left:auto;font-size:11px;font-weight:700;flex:none;align-self:center}

  .fb{margin-top:16px;border-radius:12px;padding:0 16px;max-height:0;overflow:hidden;transition:.3s ease;opacity:0}
  .fb.on{max-height:420px;padding:15px 16px;opacity:1}
  .fb.ok{background:var(--ok-bg);border:1px solid rgba(15,118,110,.28)}
  .fb.no{background:var(--err-bg);border:1px solid rgba(185,28,28,.25)}
  .fb .fb-h{font-size:13.5px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .fb.ok .fb-h{color:var(--good)}
  .fb.no .fb-h{color:var(--bad)}
  .fb .fb-t{font-size:13px;line-height:1.8;color:var(--text)}
  .fb .kp{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;background:rgba(99,102,241,.12);color:var(--accent-text)}

  .combo{
    position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.6);z-index:60;
    font-size:34px;font-weight:900;letter-spacing:-1px;
    background:linear-gradient(135deg,#f59e0b,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;pointer-events:none;
  }
  .combo.pop{animation:comboPop .9s cubic-bezier(.2,1.2,.4,1)}
  @keyframes comboPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    70%{opacity:1;transform:translate(-50%,-70%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-100%) scale(.9)}
  }

  .nextbtn{
    margin-top:16px;width:100%;padding:13px;border-radius:12px;font-size:14.5px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 6px 20px rgba(99,102,241,.3);
    transition:.2s;
  }
  .nextbtn:hover{transform:translateY(-1px);box-shadow:0 9px 26px rgba(99,102,241,.38)}
  .nextbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .nextbtn.ghost{background:var(--panel-solid);color:var(--text);border:1px solid var(--panel-border);box-shadow:none}
  .nextbtn.ghost:hover{transform:none;box-shadow:none;border-color:var(--muted)}

  /* ===== 结算 ===== */
  .res-head{text-align:center;padding:8px 0 4px}
  .res-head .em{font-size:44px;line-height:1.2}
  .res-head h2{font-size:21px;font-weight:800;margin-top:6px}
  .res-head p{font-size:13px;color:var(--muted);margin-top:3px}
  .res-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
  .rn{text-align:center;padding:14px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-border)}
  .rn .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .rn .l{font-size:11px;color:var(--muted);margin-top:1px}
  .rn.hi .v{color:var(--gold)}
  .res-star{display:flex;justify-content:center;gap:5px;font-size:24px;margin:6px 0 4px}
  .res-star .s{color:var(--dim);opacity:.3;transition:.3s}
  .res-star .s.on{color:#f59e0b;opacity:1;transform:scale(1.1)}

  /* 开箱 */
  .chest{text-align:center;margin:18px 0 4px}
  .chest-box{
    width:88px;height:88px;margin:0 auto;border-radius:22px;display:flex;align-items:center;justify-content:center;
    font-size:40px;background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(244,63,94,.12));
    border:1px solid rgba(245,158,11,.3);cursor:pointer;transition:.2s;
  }
  .chest-box:hover{transform:scale(1.05)}
  .chest-box.shake{animation:shake .5s ease infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) scale(1.04)}75%{transform:rotate(7deg) scale(1.04)}}
  .chest p{font-size:12px;color:var(--muted);margin-top:9px}

  .draw{
    margin-top:14px;border-radius:14px;padding:18px;text-align:center;
    border:2px dashed rgba(245,158,11,.4);background:rgba(245,158,11,.05);
    opacity:0;transform:scale(.94);transition:.35s;display:none;
  }
  .draw.on{opacity:1;transform:none;display:block}
  .draw .rar{font-size:11px;font-weight:800;letter-spacing:1.5px;padding:2px 10px;border-radius:99px;display:inline-block}
  .rar.r{background:#94a3b8;color:#fff}
  .rar.sr{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
  .rar.ssr{background:linear-gradient(135deg,#f59e0b,#f43f5e);color:#fff}
  .draw h3{font-size:16px;font-weight:800;margin:8px 0 3px}
  .draw p{font-size:12.5px;color:var(--muted);line-height:1.7}

  /* ===== 成就墙 ===== */
  .ach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ach{
    display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:12px;
    background:var(--panel);border:1px solid var(--panel-border);transition:.2s;
  }
  .ach.off{opacity:.45}
  .ach .a-ico{
    width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:17px;background:var(--track);
  }
  .ach.on .a-ico{background:linear-gradient(135deg,#f59e0b,#f43f5e)}
  .ach .a-b h4{font-size:13px;font-weight:700}
  .ach .a-b p{font-size:11px;color:var(--muted);line-height:1.6;margin-top:1px}
  .ach .a-b .a-t{font-size:10px;font-weight:700;color:var(--accent-text);margin-top:3px;display:block}

  /* ===== 图鉴 ===== */
  .dex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .dex{
    padding:14px 10px;border-radius:12px;text-align:center;background:var(--panel);
    border:1px solid var(--panel-border);transition:.2s;
  }
  .dex.off{opacity:.35;filter:grayscale(1)}
  .dex .d-r{font-size:9.5px;font-weight:800;letter-spacing:1px;padding:1px 7px;border-radius:99px;display:inline-block}
  .dex .d-r.r{background:#94a3b8;color:#fff}
  .dex .d-r.sr{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
  .dex .d-r.ssr{background:linear-gradient(135deg,#f59e0b,#f43f5e);color:#fff}
  .dex .d-e{font-size:26px;margin:6px 0 2px}
  .dex h4{font-size:11.5px;font-weight:700;line-height:1.4}
  .dex p{font-size:10px;color:var(--muted);margin-top:1px;line-height:1.5}

  /* ===== toast ===== */
  .toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:calc(100% - 32px);max-width:400px;pointer-events:none}
  .toast{
    display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:12px;
    background:var(--panel-solid);border:1px solid var(--panel-border);box-shadow:var(--shadow-md);
    font-size:13px;animation:tin .3s ease;width:100%;
  }
  .toast .ti{font-size:18px;flex:none}
  .toast b{font-weight:800}
  .toast.gold{border-color:rgba(245,158,11,.5);background:linear-gradient(120deg,rgba(245,158,11,.12),var(--panel-solid))}
  @keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

  @media(max-width:640px){
    .wrap{padding:0 14px 50px}
    .levels{grid-template-columns:1fr}
    .ach-grid{grid-template-columns:1fr}
    .brand{font-size:13.5px}
    .stem{font-size:15px}
    .res-nums{grid-template-columns:repeat(3,1fr)}
    .dex-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  /* 小屏（≤372）：让「返回课程」收成箭头，把位置留给品牌名，品牌不再整段消失 */
  @media(max-width:372px){
    .back{padding:7px 10px}
    .back .bt{display:none}
    .brand{font-size:12.5px;gap:6px}
    .stat-chip{font-size:12px;padding:5px 9px}
  }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="wrap">
  <div class="topbar">
    <a class="back" href="./index.html" aria-label="返回课程"><span class="ar">←</span><span class="bt">返回课程</span></a>
    <div class="brand"><span class="dot"></span><span>投行梗学闯关</span></div>
    <div class="stat-chip" id="c-gold">💰 0</div>
    <button class="icon-btn" id="c-theme" title="切换深浅色">🌙</button>
  </div>

  <!-- 首页 -->
  <section class="view on" id="v-home">
    <div class="hero">
      <div class="hero-top">
        <div class="rank-badge" id="h-rank-ico">🎓</div>
        <div class="hero-tt">
          <h1 id="h-rank">实习生</h1>
          <p id="h-sub">一关一个梗，把投行概念嚼碎</p>
        </div>
        <div class="stat-chip rank" id="h-total">已答 0 题</div>
      </div>
      <div class="progress"><i id="h-bar" style="width:0%"></i></div>
      <div class="hero-foot"><span id="h-foot-l">距下一段位还需 500 金币</span><span id="h-foot-r">0%</span></div>
    </div>

    <div class="sec"><span class="bar"></span><h2>关卡地图</h2><span class="more" id="h-cleared">0 / 8 关</span></div>
    <div class="levels" id="levels"></div>

    <div class="sec"><span class="bar"></span><h2>每日挑战</h2><span class="more" id="daily-date"></span></div>
    <button class="daily" id="btn-daily">

<script>

  /* 打乱选项：每 4 题恰好覆盖 A/B/C/D 各一次，块内顺序再哈希打乱。
     既保证整体答案分布严格均衡（不会「答案全是 B」），又不会呈现简单循环。 */
  function h32(n) {
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
    n = n ^ (n >>> 16);
    return n >>> 0;

    var block = Math.floor(idx / 4), base = idx % 4;
    var perm = [0, 1, 2, 3], s = h32(block * 2654435761 + 11);

      s = h32(s + i * 0x9e3779b9);
      var j = s % (i + 1);
      var t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    var target = perm[base];
    var others = [0, 1, 2, 3].filter(function (x) { return x !== q.a; });
    var s2 = h32(block * 97 + base * 13 + 5);
    for (var m = others.length - 1; m > 0; m--) {

    }
    var order = []; order[target] = q.a;
    var k = 0;
    for (var z = 0; z < 4; z++) if (z !== target) order[z] = others[k++];
    var opts = [];
    for (var y = 0; y < 4; y++) opts.push(q.o[order[y]]);

        o: ['约 ' + money(offer) + ' 元', '约 ' + money(p * (1 - prem / 100)) + ' 元', '即 ' + p + ' 元', '约 ' + money(p * 2) + ' 元'],

  ];

  function optUniq(o) {
    var m = {}, n = 0;
    for (var i = 0; i < o.length; i++) { if (!m[o[i]]) { m[o[i]] = 1; n++; } }
    return n;
  }

  function genQuestions(seedStr, n) {
    var out = [];
    var base = 0;
    for (var i = 0; i < seedStr.length; i++) base = (base * 31 + seedStr.charCodeAt(i)) % 100000;
    var used = {};
    for (var j = 0; j < n; j++) {
      var idx = (base + j * 3) % GEN.length;
      var guard = 0;
      while (used[idx] && guard++ < 20) idx = (idx + 1) % GEN.length;
      used[idx] = 1;
      /* 选项若撞车（两个干扰项算出同一个数），换个种子重生成，避免出现两个一样的选项 */
      var seedQ = base + j * 137 + 7, q = GEN[idx](seedQ), g2 = 0;
      while (optUniq(q.o) < 4 && g2++ < 8) { seedQ += 1301; q = GEN[idx](seedQ); }
      out.push({ c: 99, kp: q.kp, m: q.m, q: q.q, o: q.o, a: q.a, w: q.w, _seed: base + j * 37 });
    }
    return out;
  }

  /* ============ 状态与视图 ============ */
  var P = null;

  function show(v) {
    var ids = ['home', 'play', 'res', 'ach', 'dex'];
    for (var i = 0; i < ids.length; i++) {
      var node = $('v-' + ids[i]);
      if (node) node.classList.toggle('on', ids[i] === v);
    }
    if (v === 'home') renderHome();
    if (v === 'ach') renderAch();
    if (v === 'dex') renderDex();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* 弹窗排队：同屏最多 2 条，多出来的排队等空位，不再一条压一条糊住按钮 */
  var toastQ = [];
  function toast(ico, txt, gold, ms) {
    toastQ.push({ ico: ico, txt: txt, gold: gold, ms: ms || 2600 });
    pumpToast();
  }
  function pumpToast() {
    var box = $('toasts');
    if (!box) return;
    if (box.children.length >= 2) return;
    var job = toastQ.shift();
    if (!job) return;
    var t = el('div', 'toast' + (job.gold ? ' gold' : ''));
    t.innerHTML = '<span class="ti">' + job.ico + '</span><div>' + job.txt + '</div>';
    box.appendChild(t);
    setTimeout(function () {
      t.style.transition = '.3s'; t.style.opacity = '0'; t.style.transform = 'translateY(8px)';
      setTimeout(function () { t.remove(); pumpToast(); }, 320);
    }, job.ms);
  }

  /* ============ 首页 ============ */

  /* ============ 开始关卡 ============ */
  /* 从题池里随机抽 n 题：每次进关顺序不同，重玩不会是同一套题 */
  function drawN(pool, n) {
    var a = pool.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a.slice(0, Math.min(n, a.length));
  }

  function startLevel(no) {
    var pool = [];
    for (var i = 0; i < BANK.length; i++) if (BANK[i].c === no) pool.push(BANK[i]);
    var qs = drawN(pool, LEVEL_QUESTIONS);
    /* 已通关的关卡算「复练」：每题承销费减半、通关奖励不再发放，堵住重复刷金币 */
    var repeat = !!S.cleared[no];
    P = { mode: 'level', lv: no, qs: qs, i: 0, right: 0, combo: 0, t0: Date.now(), wrong: 0, gold: 0, answered: false, comeback: 0, repeat: repeat, rate: repeat ? 0.5 : 1 };
    $('p-lv').textContent = LEVELS[no].ch + '　·　第 ' + (no + 1) + ' 关' + (repeat ? '　·　复练' : '');
    show('play');
    renderQ();
  }

  function startDaily() {
    if (S.dailyDone === today()) { toast('✅', '今天的每日挑战已经完成，明天再来'); return; }
    /* 第一次用当天做种子；当天失败重试时带一个次数，换一组数字 */
    var qs = genQuestions(today() + (S.dailyFail === today() ? '·' + (S.dailyTries || 1) : ''), 5);
    P = { mode: 'daily', lv: -1, qs: qs, i: 0, right: 0, combo: 0, t0: Date.now(), wrong: 0, gold: 0, answered: false, comeback: 0 };
    $('p-lv').textContent = '每日挑战 · ' + today();
    show('play');
    renderQ();
  }

  /* ============ 答题 ============ */
  function renderQ() {
    var q = P.qs[P.i];
    var sh = shuffleOpts(q, q._i != null ? q._i : (q._seed || 0));
    P.cur = { q: q, opts: sh.o, a: sh.a, t: Date.now() };
    P.answered = false;

    $('p-n').textContent = (P.i + 1) + ' / ' + P.qs.length;
    $('p-bar').style.width = (P.i / P.qs.length * 100) + '%';
    $('p-meme').innerHTML = '<b>梗</b>　' + esc(q.m);
    $('p-stem').textContent = q.q;

    var box = $('p-opts'); box.innerHTML = '';
    var keys = ['A', 'B', 'C', 'D'];
    for (var i = 0; i < sh.o.length; i++) {
      var b = el('button', 'opt');
      b.innerHTML = '<span class="k">' + keys[i] + '</span><span>' + esc(sh.o[i]) + '</span>';
      (function (idx, node) { node.onclick = function () { answer(idx, node); }; })(i, b);
      box.appendChild(b);
    }
    var fb = $('p-fb'); fb.className = 'fb'; $('p-next').disabled = true;
    $('p-next').textContent = (P.i === P.qs.length - 1) ? '看结算' : '下一题';
  }

  function answer(idx, node) {
    if (P.answered) return;
    P.answered = true;
    var c = P.cur, ok = idx === c.a;
    var nodes = $('p-opts').children;
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.add('dis');
      nodes[i].onclick = null;
      if (i === c.a) { nodes[i].classList.add('right'); }
      else if (i === idx) { nodes[i].classList.add('wrong'); }
    }

    var secs = (Date.now() - c.t) / 1000;
    S.qTotal++;

    var fb = $('p-fb');
    if (ok) {
      P.right++; S.qRight++;
      P.combo++; P.comeback++;
      if (P.combo > S.comboMax) S.comboMax = P.combo;
      if (secs <= 3) { S.fastRight++; }
      if (P.comeback >= 4) S.comeback = (S.comeback || 0) + 1;
      var gain = Math.round((10 + Math.min(P.combo - 1, 5) * 2) * (P.rate || 1));
      P.gold += gain; S.gold += gain;
      fb.className = 'fb ok on';
      $('p-fbh').innerHTML = '✓ 答对了　<span style="color:var(--gold);font-size:12.5px">+' + gain + ' 承销费</span>';
      if (P.combo >= 3) showCombo(P.combo);
    } else {
      P.combo = 0; P.comeback = 0; P.wrong++;
      fb.className = 'fb no on';
      $('p-fbh').textContent = '✗ 答错了';
    }
    $('p-fbt').textContent = c.q.w;
    $('p-kp').textContent = c.q.kp || '知识点';
    $('p-next').disabled = false;
    $('c-gold').textContent = '💰 ' + S.gold;
    save();
  }

  function showCombo(n) {
    var c = $('combo');
    c.textContent = 'COMBO ×' + n;
    c.classList.remove('pop');
    void c.offsetWidth;
    c.classList.add('pop');
  }

  function nextQ() {
    if (P.i < P.qs.length - 1) {
      P.i++;
      renderQ();
    } else {
      finish();
    }
  }

  /* ============ 结算 ============ */
  function finish() {
    var n = P.qs.length, acc = Math.round(P.right / n * 100);
    var isLevel = P.mode === 'level';
    var pass = acc >= 50;
    var stars = acc >= 100 ? 3 : acc >= 75 ? 2 : acc >= 50 ? 1 : 0;
    var wasCleared = isLevel && !!S.cleared[P.lv];
    var oldStars = isLevel ? (S.stars[P.lv] || 0) : 0;
    /* 首通给通关奖励；复练只有「星级提升」才补差额，重复刷关不再产出金币 */
    var bonus = 0;
    if (isLevel && pass) {
      if (!wasCleared) bonus = stars * 20;
      else if (stars > oldStars) bonus = (stars - oldStars) * 20;
      S.gold += bonus;
    }

    if (isLevel) {
      if (pass) {
        if (!wasCleared) S.cleared[P.lv] = 1;
        if ((S.stars[P.lv] || 0) < stars) S.stars[P.lv] = stars;
        if (acc === 100) S.perClear = (S.perClear || 0) + 1;
        var secs = (Date.now() - P.t0) / 1000;
        if (acc === 100 && secs < 120) S.fastPure = (S.fastPure || 0) + 1;
        if (!wasCleared && S.attemptedFailed && S.attemptedFailed[P.lv]) S.retried = 1;
      } else {
        S.attemptedFailed = S.attemptedFailed || {};
        S.attemptedFailed[P.lv] = 1;
        if (P.right === 0) S.allWrong = 1;
      }
    } else if (pass) {
      S.dailyDone = today();
      S.dailyCount = (S.dailyCount || 0) + 1;
    } else {
      /* 没通过不算完成：不写 dailyDone，当天可以再试 */
      S.dailyFail = today();
      S.dailyTries = (S.dailyTries || 0) + 1;
    }

    /* 连续天数 */
    var td = today();
    if (S.lastDay !== td) {
      if (S.lastDay === dayKey(1)) S.dayStreak = (S.dayStreak || 0) + 1;
      else S.dayStreak = 1;
      S.lastDay = td;
    }
    S.days[td] = 1;

    $('r-em').textContent = acc === 100 ? '🏆' : pass ? '🎉' : '💪';
    $('r-title').textContent = isLevel
      ? (pass ? (wasCleared ? '复练完成' : '第 ' + (P.lv + 1) + ' 关通关') : '没过，再来一次')
      : (pass ? '今日挑战完成' : '今日挑战未通过');
    $('r-sub').textContent = isLevel
      ? LEVELS[P.lv].name + (wasCleared ? '　·　复练金币减半，通关奖励只在星级提升时补发' : '')
      : (pass ? '明天换一组新数字，记得回来' : '答对 3 题以上才算完成，今天还能再试一次');
    $('r-acc').textContent = acc + '%';
    $('r-right').textContent = P.right + '/' + n;
    $('r-gold').textContent = '+' + (P.gold + bonus);

    var sb = $('r-stars'); sb.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var s = el('span', 's' + (i < stars ? ' on' : ''), '★');
      s.style.transitionDelay = (i * 0.12) + 's';
      sb.appendChild(s);
    }

    /* 开箱：只有通关的关卡和每日挑战才给 */
    P.canChest = pass;
    $('r-chest').style.display = pass ? '' : 'none';
    $('r-chest-t').style.display = pass ? '' : 'none';
    $('r-chest-t').textContent = '点一下开箱';
    $('r-chest').textContent = '📦';
    $('r-chest').classList.add('shake');
    $('r-draw').className = 'draw';

    /* 按钮：通关后直接给「下一关」，不用退回地图再点 */
    var curLv = isLevel ? P.lv : -1;
    var hasNext = isLevel && pass && curLv < LEVELS.length - 1;
    var nb = $('r-next');
    if (hasNext) {
      nb.style.display = '';
      nb.textContent = '下一关 · ' + LEVELS[curLv + 1].name;
      nb.onclick = (function (nx) { return function () { startLevel(nx); }; })(curLv + 1);
      $('r-again').className = 'nextbtn ghost';
      $('r-again').textContent = '重打这一关';
    } else {
      nb.style.display = 'none';
      nb.onclick = null;
      $('r-again').className = 'nextbtn';
      $('r-again').textContent = isLevel ? '再打这一关' : (pass ? '回到地图' : '再试一次');
    }
    $('r-again').onclick = function () {
      if (isLevel) startLevel(curLv);
      else if (pass) show('home');
      else startDaily();
    };

    save();
    checkAch();
    show('res');
  }

  function openChest() {
    if (!P || !P.canChest || P.chestOpened) return;
    P.chestOpened = true;
    var box = $('r-chest');
    box.classList.remove('shake');
    box.textContent = '🎁';

    var roll = Math.random();
    var tier = roll < 0.07 ? 'SSR' : roll < 0.35 ? 'SR' : 'R';
    var pool = [];
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].r === tier) pool.push(CARDS[i]);
    var card = pool[Math.floor(Math.random() * pool.length)];
    var isNew = !S.cards[card.id];
    S.cards[card.id] = (S.cards[card.id] || 0) + 1;
    save();

    var d = $('r-draw');
    $('r-rar').textContent = card.r;
    $('r-rar').className = 'rar ' + card.r.toLowerCase();
    $('r-card').textContent = card.e + '　' + card.n;
    $('r-card-d').innerHTML = esc(card.d) + (isNew
      ? '　·　<span style="color:var(--gold);font-weight:700">新卡入册</span>'
      : '　·　重复获得，已累加');
    d.className = 'draw on';

    if (tier === 'SSR') toast('✨', '<b>' + card.n + '</b>　SSR 出货！', true);
    checkAch();
  }

  /* ============ 成就检查 ============ */
  function checkAch() {
    var got = [];
    for (var i = 0; i < ACH.length; i++) {
      var a = ACH[i];
      if (S.ach[a.id]) continue;
      var pass = false;
      try { pass = !!a.t(); } catch (e) { pass = false; }
      if (pass) { S.ach[a.id] = Date.now(); got.push(a); }
    }
    save();
    if (!got.length) return;
    /* 一次解锁多个只弹一条汇总，避免连弹十几条糊住界面 */
    if (got.length === 1) {
      toast(got[0].e, '成就解锁　<b>' + got[0].n + '</b>', true, 2400);
    } else {
      var names = [];
      for (var g = 0; g < got.length && g < 3; g++) names.push(got[g].n);
      toast('🏅', '一次解锁 <b>' + got.length + '</b> 个成就　' + names.join('、') +
        (got.length > 3 ? ' 等' : ''), true, 3200);
    }
  }

  /* ============ 成就墙 ============ */
  function renderAch() {
    var box = $('ach-list'); box.innerHTML = '';
    var n = 0;
    var cats = ['进度', '技巧', '积累', '图鉴', '坚持', '隐藏'];
    var sorted = ACH.slice().sort(function (a, b) {
      var ia = cats.indexOf(a.c), ib = cats.indexOf(b.c);
      return ia - ib;
    });
    for (var i = 0; i < sorted.length; i++) {
      var a = sorted[i], on = !!S.ach[a.id];
      if (on) n++;
      var d = el('div', 'ach ' + (on ? 'on' : 'off'));
      d.innerHTML = '<div class="a-ico">' + (on ? a.e : '🔒') + '</div>' +
        '<div class="a-b"><h4>' + esc(a.n) + '</h4><p>' + esc(a.d) + '</p>' +
        '<span class="a-t">' + a.c + (on ? ' · 已解锁' : '') + '</span></div>';
      box.appendChild(d);
    }
    $('ach-cnt').textContent = n + ' / ' + ACH.length;
  }

  /* ============ 图鉴 ============ */
  function renderDex() {
    var box = $('dex-list'); box.innerHTML = '';
    var n = 0;
    for (var i = 0; i < CARDS.length; i++) {
      var c = CARDS[i], has = !!S.cards[c.id];
      if (has) n++;
      var d = el('div', 'dex ' + (has ? '' : 'off'));
      d.innerHTML = '<span class="d-r ' + c.r.toLowerCase() + '">' + c.r + '</span>' +
        '<div class="d-e">' + (has ? c.e : '❔') + '</div>' +
        '<h4>' + (has ? esc(c.n) : '未解锁') + '</h4>' +
        '<p>' + (has ? esc(c.d) : '继续闯关开箱') + '</p>';
      box.appendChild(d);
    }
    $('dex-cnt').textContent = n + ' / ' + CARDS.length;
  }

  /* ============ 主题 ============ */
  function initTheme() {
    var t = 'light';
    try { t = localStorage.getItem('ibank-theme') || 'light'; } catch (e) {}
    document.body.classList.toggle('dark', t === 'dark');
    $('c-theme').textContent = t === 'dark' ? '☀️' : '🌙';
    $('c-theme').onclick = function () {
      var dark = document.body.classList.toggle('dark');
      $('c-theme').textContent = dark ? '☀️' : '🌙';
      try { localStorage.setItem('ibank-theme', dark ? 'dark' : 'light'); } catch (e) {}
    };
  }

  /* ============ 初始化 ============ */
  function boot() {
    S = load();
    /* 给每题一个稳定序号，用于「分块均衡」打乱选项位置 */
    for (var bi = 0; bi < BANK.length; bi++) BANK[bi]._i = bi;
    S.attemptedFailed = S.attemptedFailed || {};
    S.comeback = S.comeback || 0;
    S.fastPure = S.fastPure || 0;
    S.dailyCount = S.dailyCount || 0;
    S.dailyTries = S.dailyTries || 0;

    initTheme();
    renderHome();

    $('p-next').onclick = nextQ;
    $('p-quit').onclick = function () { show('home'); };
    $('r-chest').onclick = openChest;
    $('r-home').onclick = function () { show('home'); };
    $('btn-daily').onclick = startDaily;

    document.addEventListener('keydown', function (e) {
      if (!$('v-play').classList.contains('on')) return;
      var k = e.key;
      if (k >= '1' && k <= '4' && !P.answered) {
        var idx = +k - 1;
        var node = $('p-opts').children[idx];
        if (node) answer(idx, node);
      } else if ((k === 'Enter' || k === ' ') && P.answered) {
        e.preventDefault();
        nextQ();
      }
    });

    checkAch();

    window.GM = { show: show, S: S };
  }

  boot();
})();
</script>
</body>
</html>
